<script type="text/babel" data-presets="env-react-classic">
const {useState,useEffect,useRef,useReducer} = React;

/* ================= 数据 =================
   与 CONTEXT.md 对齐：
   - 稿件行 = { id(独立), spk, text }，无 TTS 配置（停顿/语气/语速/情感属脚本行）
   - 行号 L001 由位置推导（既是序列号也是顺序），id 永不复用 */
const DATA = {

    cast:[
      { id:"host", name:"主持人", avatar:"主", color:"#312e81", voice:"Amy · 中文女声 · 沉稳", accent:"#c7d2fe" },
      { id:"guest", name:"嘉宾", avatar:"嘉", color:"#3f2d12", voice:"Liam · 中文男声 · 明快", accent:"#fde68a" }
    ],
    episodes:[
      { id:"ep1", title:"AI 芯片那点事", target:25, status:"草稿", updated:"昨天",
        lines:[
          { id:"m01", spk:"host", text:"今天我们聊一个反直觉的话题：芯片为什么成了 AI 时代的硬通货。" },
          { id:"m02", spk:"guest", text:"对，我第一次看到训练集群账单的时候，第一反应是这数字是不是多打了一个零。" },

          { id:"m04", spk:"guest", text:"其实核心就一个词——算力。模型参数越大，需要的芯片就越多，这不是比喻，是真金白银。" },
          { id:"m05", spk:"host", text:"所以现在各家都在抢产能，本质上是抢什么？" },
          { id:"m06", spk:"guest", text:"抢的是时间窗口。谁先拿到足够的卡，谁就能先训练更大的模型，然后滚雪球。" },
          { id:"m07", spk:"host", text:"这让我想到一个更尖锐的问题：小公司还有机会吗？" },
          { id:"m08", spk:"guest", text:"有，但路径变了。以前拼算力，现在拼的是把算力用得更聪明的算法。" },
        ]
      },
      { id:"ep2", title:"量子计算科普", target:20, status:"草稿", updated:"3 天前", lines:null }
    ],
    res:[
      { name:"芯片行业深度报告.pdf", type:"pdf", chunks:["2025 年全球 AI 芯片市场规模约 780 亿美元，年增 38%。","训练集群主要由 GPU 构成，英伟达占据八成以上份额。","产能瓶颈集中在先进封装与 HBM 存储，交期已排到 12 个月。","算力单价逐年下降，但总预算因模型规模扩张反而翻倍。"] },
      { name:"从训练到推理的成本账.md", type:"md", chunks:["训练一次千亿参数模型的电费即可达数百万美元。","推理阶段成本随用户量线性增长，是长期开支大头。","小公司转向稀疏化与小模型蒸馏，用算法换算力。"] },
      { name:"OpenAI 与英伟达的产能合作新闻", type:"url", chunks:["报道：两家达成数千亿芯片采购协议，锁定未来两年供给。","评论：这一举动被视为算力军备竞赛的标志性事件。"] }
    ]
  },
  "美食坊":{
    color:"#ef4444", icon:"🍳",
    desc:"家常菜 · 生活向",
    meta:{ topic:"家常菜与厨房科学", outline:"高汤 → 火候 → 小技巧", created:"2026-02-03", tone:"亲切、像邻居大姐在厨房聊天", terms:["乳化","撇沫"], banned:["米其林"] },
    cast:[
      { id:"host", name:"主持人", avatar:"主", color:"#831843", voice:"Momo · 中文女声 · 亲切", accent:"#f9a8d4" }
    ],
    episodes:[
      { id:"ep1", title:"家常高汤的秘密", target:15, status:"草稿", updated:"上周", lines:null }
    ],
    res:[
      { name:"高汤熬制的科学.md", type:"md", chunks:["汤色奶白的秘密在于脂肪乳化，而非长时间猛火。","蛋白质与氨基酸在 90 度附近溶出最多，沸腾反而破坏风味。"] },
      { name:"家常高汤食谱.pdf", type:"pdf", chunks:["基础配方：鸡架、猪骨、姜葱、清水比例 1:3。","分三次撇沫、中途不加水，是汤清不浊的要点。"] }
    ]
  }
};

/* ================= 运行时状态 ================= */
const EP_VIEWS = [
  { key:"writer",  label:"写稿大师", icon:"✍️", desc:"稿件（内容）" },
  { key:"mixer",   label:"调音大师", icon:"🎛", desc:"脚本（TTS 配置）" },
  { key:"archive", label:"档案馆",   icon:"🗃", desc:"音频档案" },
];

let S = {
  route:null, ws:null, ep:0,
  pending:{ set:{}, notes:{}, baseline:null, ep:null },
  selLines:[], rewriteUndo:{},
  scripts:[], cache:{},          /* cache: 脚本行id -> {synth} 音频缓存，挂脚本行 */
  mixerActive:null,              /* 调音大师：当前点开的脚本 */
  auditorRan:false, checks:{ g1:[false,false,false], g2:[false,false,false] },
  chats:{ writer:[], mixer:{} }, /* 写稿大师会话(一集一个)；调音大师一版脚本一个会话 */
  toast:null, toastTimer:null,
  syncTimer:null,
};

let force = () => {};
const tick = () => force();

/* ---- 基础工具 ---- */
const enc = encodeURIComponent;
const uid = (p="x") => p+"_"+Math.random().toString(36).slice(2,9);
const E = id => document.getElementById(id);

function parseHash(){
  const h=(location.hash.replace(/^#/,"")||"/");
  const p=h.split("/").filter(Boolean).map(decodeURIComponent);
  if(p.length===0) return { name:"home" };
  if(p[0]==="ws"){
    const name=p[1];
    if(!DATA[name]) return { name:"home" };
    if(p[2]==="resources") return { name:"resources", ws:name };
    if(p[2]==="ep"){
      const i=parseInt(p[3],10);
      if(isNaN(i)||!DATA[name].episodes[i]) return { name:"ws", ws:name };
      const view=p[4]||"writer";
      return { name:"ep", ws:name, ep:i, view:["writer","mixer","archive"].includes(view)?view:"writer" };
    }
    return { name:"ws", ws:name };
  }
  return { name:"home" };
}

const getWs = () => DATA[S.ws];
const getEp = () => getWs().episodes[S.ep];
const getSpeaker = id => getWs().cast.find(c=>c.id===id) || getWs().cast[0];
const getLines = () => {                     /* 稿件：活实体，逻辑删除过滤 */
  const ep=getEp(); if(!ep.lines) return [];
  return ep.lines.filter(l=>!l.deleted);
};
const serialOf = idx => "L"+String(idx+1).padStart(3,"0");

function toast(msg){
  S.toast={ msg, key:Date.now() };
  clearTimeout(S.toastTimer);
  S.toastTimer=setTimeout(()=>{ S.toast=null; tick(); },2400);
  tick();
}

/* ================= 修改：先暂存，确认后持久化 ================= */
function pendingCount(){ return Object.keys(S.pending.set||{}).length; }
function ensurePending(){
  const key=S.ws+":"+S.ep;
  if(S.pending.ep!==key){ S.pending={ set:{}, notes:{}, baseline:null, ep:key }; }
  if(!S.pending.baseline) S.pending.baseline=JSON.parse(JSON.stringify(getEp().lines||[]));
}
function touch(id,note){ S.pending.set[id]=true; S.pending.notes[id]=note; }
function commitPending(){
  if(!pendingCount()) return;
  const notes=Object.entries(S.pending.notes).map(([id,n])=>`${id} ${n}`).join("、");
  writerChat().push({who:"ai", role:"align", text:`📌 用户提交改动（${pendingCount()} 处）：${notes} —— 已持久化并记入上下文。`});
  S.pending={ set:{}, notes:{}, baseline:JSON.parse(JSON.stringify(getEp().lines||[])), ep:S.ws+":"+S.ep };
  tick();
}
function revertPending(){
  if(!pendingCount()) return;
  getEp().lines=JSON.parse(JSON.stringify(S.pending.baseline));
  S.pending={ set:{}, notes:{}, baseline:null, ep:S.ws+":"+S.ep };
  toast("已撤销全部改动");
}

/* ================= 会话：写稿大师一集一个；调音大师一版脚本一个 ================= */
function writerChat(){
  if(!S.chats.writer.length){
    S.chats.writer = [
      { who:"ai", role:"align", text:"我是写稿大师（编辑页），只管稿件（内容）：写稿、改稿、对齐都在这个会话里。这集想聊什么方向？节目元数据里你偏爱「先讲事实，再讲观点」。" },
      { who:"me", text:"聊芯片产能，想听小公司怎么活" },
      { who:"ai", role:"align", text:"好，方向已对齐：主题、核心论点 ×3、素材引用 ×4。结论留在这个会话里，要写稿就直说。" },
      { who:"me", text:"写稿吧" },
      { who:"ai", role:"writer", text:"已用 add / edit 工具把第一版落进「编辑」页（稿件）。想改哪段直接说。" },
      { who:"me", text:"第三部分有点干" },
      { who:"ai", role:"writer", text:"收到。我用 edit 工具重写了 L005–L008，改成更口语的来回。这是改动预览，接受就落稿：",
        proposal:{ lines:"L005–L008", text:"把「本质上是抢什么？」改成一句反问，答案由嘉宾带出，减少主持人的设问。" } },
    ];
  }
  return S.chats.writer;
}
function mixerChat(msId){
  if(!S.chats.mixer[msId]){
    const m=S.scripts.find(x=>x.id===msId);
    S.chats.mixer[msId] = [
      { who:"ai", role:"mixer", text:`我是调音大师，正在跟这版脚本「${m?m.ver:"?"}」（${m?m.snap:""}）：读脚本（内容 + TTS 配置）、逐行调停顿/语气/语速/情感（tune）、触发合成。改内容请回「写稿大师」页。` },
      { who:"me", text:"合成这一版" },
      { who:"ai", role:"mixer", text:"好，我读取这版脚本（内容 + TTS 配置），开始合成。缓存命中的行直接复用。" },
      { who:"me", text:"第二句语气活泼一点" },
      { who:"ai", role:"mixer", text:"已用 tune 把 L002 设为「活泼 / 正常 / 开心」。保存后点「重新合成」生效，快照内容一个字不变。" },
    ];
  }
  return S.chats.mixer[msId];
}
const chatFor = r => r.view==="mixer" ? mixerChat(S.mixerActive) : writerChat();

/* ================= 定稿：稿件(内容) → 脚本(拷贝行 + 默认 TTS) ================= */
const TUNE_DEFAULT = { pause:"无", tone:"自然", speed:"正常", emotion:"中性" };
const PAUSE_OPTS  = ["无","短","中","长"];
const TONE_OPTS   = ["自然","活泼","沉稳","严肃"];
const SPEED_OPTS  = ["慢","正常","快"];
const EMOTION_OPTS= ["中性","开心","低落","激动"];

function finalizeScript(){
  if(pendingCount()) commitPending();
  const lines=getLines();
  if(!lines.length){ toast("还没有稿件，无法定稿"); return; }
  const snap="snap_"+Date.now().toString(16).slice(-6)+"_"+S.ws.slice(0,2)+S.ep;
  const ver="第 "+(S.scripts.length+1)+" 版";
  const id="s_"+Date.now().toString(16);
  S.scripts.push({
    id, snap, ver, status:"todo", pct:0, hit:0, need:0, dur:"", syncedAt:"",
    /* 脚本行：从稿件行拷贝(顺序/说话人/文本) + 每行 TTS 配置；独立 uuid，不引用稿件行(无血缘指针) */
    lines: lines.map(l=>({ id: uid("sl"), spk:l.spk, text:l.text, tts:{...TUNE_DEFAULT} }))
  });
  writerChat().push({ who:"ai", role:"align", text:`📥 已定稿：用当前稿件生成了 ${ver}（${snap}）默认脚本，交给调音大师。稿件没冻结，可以继续改，改完再定稿新一版。` });
  toast(`已定稿 ${ver} · 见「调音大师」页`);
  tick();
}

/* ================= 合成：脚本 → 产物（确定性流水线） ================= */
const ST_LABEL = { todo:"待合成", running:"合成中", done:"已合成", fail:"失败" };
const SYNTH_STEPS = ["校验快照","切片 → 分片合成 TTS","拼接 · 停顿 · 响度归一","回填字级时间戳","确定性验证"];
function synthScript(id){
  const m=S.scripts.find(x=>x.id===id); if(!m) return;
  if(m.status==="running") return;
  /* 合成前先统计缓存命中：试听过的行直接复用，未命中的本次新合成 */
  const hit=m.lines.filter(l=>S.cache[l.id]?.synth).length;
  m.status="running"; m.pct=0; m.hit=hit; m.need=m.lines.length-hit;
  tick();
  let step=0, p=0;
  clearInterval(S.syncTimer);
  S.syncTimer=setInterval(()=>{
    p+=2.6; m.pct=p;
    if(p>=100){
      clearInterval(S.syncTimer); S.syncTimer=null;
      /* 合成完成：为每条脚本行生成单行语音并挂载（写入缓存，重新合成全部命中） */
      m.lines.forEach(l=>{ if(!S.cache[l.id]) S.cache[l.id]={ synth:false }; S.cache[l.id].synth=true; });
      m.status="done"; m.hit=m.lines.length; m.need=0; m.dur="约 25 分钟";
      m.syncedAt=new Date().toTimeString().slice(0,5); m.pct=100;
      mixerChat(m.id).push({who:"ai", role:"mixer", text:`📦 ${m.ver}（${m.snap}）合成完成 · 本次命中缓存 ${hit} 行，新合成 ${m.lines.length-hit} 行；单行语音已挂到各脚本行，重新合成全部命中。`});
      toast(`${m.ver} 合成完成 🎉 已归档`);
      tick();
      return;
    }
    if(p>(step+1)*100/5) step++;
    tick();
  },50);
}

/* 试听（脚本行）：生成并缓存单行音频，后续批量合成命中 */
function previewLine(m, line){
  if(!S.cache[line.id]) S.cache[line.id]={ synth:false };
  S.cache[line.id].synth=true;
  const idx=m.lines.indexOf(line);
  toast(`🎧 ${serialOf(idx)} 试听 · 单行音频已生成并缓存`);
  tick();
}
/* tune：改语气/语速/情感 → 重写该行音频；改停顿 → 只在拼接层，不重写缓存 */
function tuneSet(m, line, field, val){
  line.tts[field]=val;
  const idx=m.lines.indexOf(line);
  if(field==="pause"){
    toast(`${serialOf(idx)} 停顿 → ${val} · 只重拼接，不重写音频`);
  } else {
    if(S.cache[line.id]) S.cache[line.id].synth=false;   /* 破坏缓存 → 该行音频重写 */
    toast(`${serialOf(idx)} ${field==="tone"?"语气":field==="speed"?"语速":"情感"} → ${val} · 该行音频重写`);
  }
  m.status="todo";   /* TTS 配置变了 → 需重新合成 */
  tick();
}

/* ================= Auditor 子代理 ================= */
function runAuditorCheck(){
  writerChat().push({who:"ai", role:"auditor", text:"Auditor 子代理已接单：开启隔离上下文 + 专属校验工具（validate_script），不接触写稿 / 检索工具…"});
  tick();
  setTimeout(()=>{
    S.auditorRan=true;
    S.checks.g1=[false,true,true];
    S.checks.g2=[true,true,true];
    writerChat().push({who:"ai", role:"auditor", text:"✅ 检查完成：结构闸 1 项未过（L004 超 60 字），成稿闸 3 项通过。报告已贴在脚本页顶部。"});
    tick();
  },1400);
}

/* ================= 会话回复路由（演示） ================= */
function routeReply(t, isMixer){
  if(isMixer){
    if(/合成|出片|重新合成/.test(t)) return {role:"mixer", text:"好，我对当前脚本重新合成：读取快照 + 现有 tune 参数 → 跑合成流水线。完成后归档进「档案馆」。"};
    if(/语气|语速|情感|停顿|活泼|沉稳|开心|低落|激动|调/.test(t)) return {role:"mixer", text:"已用 tune 逐行调整听感参数（停顿/语气/语速/情感）。保存后点「重新合成」生效，快照内容不变。"};
    return {role:"mixer", text:"我是调音大师。可以让我「合成这一版」「把某句语气调活泼」等。我没有 add/edit，改脚本请回写稿大师页。"};
  }
  if(/检查|审核|把关|报告/.test(t)) return {role:"auditor", text:"Auditor 子代理开始审核稿件（隔离上下文 + 校验工具）…", triggerCheck:true};
  if(/写|改|稿|重写/.test(t)) return {role:"writer", text:"我用 edit 工具改好了。这是改动预览，接受就落稿：", proposal:{ lines:"L005–L008", text:"把「本质上是抢什么？」改成一句反问，答案由嘉宾带出。"}};
  if(/素材|查|引用|检索/.test(t)) return {role:"retriever", text:"我用 retrieve 工具检索了本工作间素材：芯片报告 #1、成本账 #2、#3。"};
  return {role:"align", text:"我是写稿大师。可以让我「写稿」「改某段」「检查」或「查素材」。"};
}

/* ================= 预计成片时长 ================= */
function calcDur(){
  const lines=getLines(); if(!lines.length) return { txt:"--:--", pct:0, over:false };
  const target=getEp().target;
  const chars=lines.reduce((s,l)=>s+l.text.length,0);
  const secs=chars/4.2;
  return {
    txt:String(Math.floor(secs/60)).padStart(2,"0")+":"+String(Math.floor(secs%60)).padStart(2,"0"),
    pct:Math.min(100,(secs/(target*60))*100),
    over:secs>target*60*1.2
  };
}
/* 原型演示：按提示做简单文本变换，真实系统由 edit 工具重写 */
function polishText(t,prompt){
  let out=t;
  if(/正式|庄重/.test(prompt)) out=out.replace(/说白了/g,"本质上是");
  else if(/短|压缩|精简/.test(prompt)) out=t.length>30 ? t.slice(0,Math.floor(t.length*0.7)).replace(/[，。、]?$/,"")+"。" : t;
  else if(/反问/.test(prompt)) out=out.replace(/(。)$/,"，对吧？").replace(/吗\?$/,"呢？");
  else out=out.replace(/本质上是/g,"说白了就是").replace(/其实就是/g,"说白了就是").replace(/所以现在/g,"所以现在嘛");
  return out!==t ? out : "说真的，"+t;
}

        <AutoTextarea value={line.text} onCommit={t=>commitText(line.id,t)} dataId={line.id}
          placeholder="输入台词…" className="w-full rounded-lg bg-transparent px-2 py-1.5 text-[13px] leading-relaxed text-txt placeholder:text-dim focus:bg-white/5 focus:ring-1 focus:ring-accent/40" />

}
function AutoTextarea({ value, onCommit, placeholder, className, dataId }){
  const ref=useRef(null);
  const [draft,setDraft]=useState(value);
  /* 受控同步：外部程序化改动（润色 / 撤销 / 换行）后刷新本地草稿 */
  useEffect(()=>{ setDraft(value); },[value]);
  useEffect(()=>{
    const el=ref.current;
    if(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
  },[draft]);
  return <textarea ref={ref} data-id={dataId} rows={1} value={draft}
    onChange={e=>setDraft(e.target.value)} onBlur={()=>onCommit(draft)}
    placeholder={placeholder} className={className+" resize-none overflow-hidden"} />;
}
function IconBtn({ children, title, onClick }){
  return <button title={title} onClick={onClick} className="grid h-7 w-7 place-items-center rounded-md text-[13px] text-muted transition-colors hover:bg-white/10 hover:text-txt">{children}</button>;
}
function RewriteBar(){
  const [prompt,setPrompt]=useState("");
  const n=S.selLines.length;
  return (
    <div className="mt-3 flex flex-wrap items-center gap-3 rounded-xl border border-accent/40 bg-accent/10 px-4 py-3 animate-slide">
      <span className="text-[13px] font-semibold text-accent2">已选中 {n} 行</span>
      <input value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder="输入润色提示，如：更口语 / 更有反问感 / 缩短 20%…（仅重写选中行）"
        className="min-w-[220px] flex-1 rounded-lg border border-line bg-panel px-3 py-1.5 text-[12.5px] outline-none transition-colors focus:border-accent/60" />
      <Btn primary onClick={()=>polishSel(prompt)}>✨ 润色重写</Btn>
      <Btn onClick={undoPolish}>↩ 撤销</Btn>
      <Btn ghost onClick={()=>{ S.selLines=[]; tick(); }}>取消</Btn>
    </div>
  );
}
function toggleSel(id){
  S.selLines = S.selLines.includes(id) ? S.selLines.filter(x=>x!==id) : [...S.selLines,id];
  tick();
}
function changeSpk(id, val){
  ensurePending();   /* 修改前先捕获 baseline（撤销全部的依据） */
  const line=getEp().lines.find(l=>l.id===id); if(!line) return;
  line.spk=val; touch(id,"改说话人");
  toast(serialOf(getLines().indexOf(line))+" 说话人 → "+getSpeaker(val).name+" · 待提交");
}
function commitText(id, text){
  ensurePending();
  const line=getEp().lines.find(l=>l.id===id); if(!line) return;
  if(text.trim()===line.text) return;
  line.text=text.trim()||line.text;
  touch(id,"改文本");
  toast(serialOf(getLines().indexOf(line))+" 已改动 · 待提交");
  tick();
}
function addLine(afterId){
  ensurePending();
  const ep=getEp(); if(!ep.lines) ep.lines=[];
  const line={ id:uid("m"), spk:getWs().cast[0].id, text:"" };
  if(afterId){ const i=ep.lines.findIndex(l=>l.id===afterId); ep.lines.splice(i+1,0,line); }
  else ep.lines.push(line);
  touch(line.id,"新增");
  tick(); toast("已新增 "+serialOf(getLines().indexOf(line))+" · 待提交");
}
function deleteLine(id){
  ensurePending();
  const line=getEp().lines.find(l=>l.id===id); if(!line) return;
  line.deleted=true;   /* 逻辑删除：id 保留，read/视图过滤 */
  touch(id,"删除");
  tick(); toast("已删除 "+serialOf(getLines().indexOf(line))+" · 待提交");
}
function focusEdit(id){
  const ta=document.querySelector(`textarea[data-id="${id}"]`);
  if(ta){ ta.focus(); ta.select(); }
}
function polishSel(prompt){
  if(!S.selLines.length) return;
  ensurePending();
  const p=prompt.trim()||"更口语一点";
  S.rewriteUndo={};
  S.selLines.forEach(id=>{
    const line=getEp().lines.find(l=>l.id===id); if(!line) return;
    S.rewriteUndo[id]=line.text;
    line.text=polishText(line.text,p);
    touch(id,"润色");
  });
  const n=S.selLines.length;
  toast(`已用 edit 润色 ${n} 行（${p}）· 待提交`);
}
function undoPolish(){
  Object.entries(S.rewriteUndo).forEach(([id,orig])=>{
    const line=getEp().lines.find(l=>l.id===id); if(!line) return;
    line.text=orig;
    delete S.pending.set[id]; delete S.pending.notes[id];
  });
  S.rewriteUndo={};
  toast("↩ 已撤销润色");
}

function ChatInput({ chat, isMixer, placeholder }){
  const [val,setVal]=useState("");
  const send=()=>{
    const t=val.trim(); if(!t) return;
    chat.push({who:"me", text:t});
    setVal("");
    tick();
    setTimeout(()=>{
      const reply=routeReply(t,isMixer);
      chat.push(reply);
      tick();
      if(reply.triggerCheck) runAuditorCheck();
    },700);
  };
  return (
    <div className="flex items-end gap-2">
      <textarea value={val} onChange={e=>setVal(e.target.value)} rows={2}
        onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } }}
        placeholder={placeholder}
        className="max-h-32 flex-1 resize-none rounded-xl border border-line bg-panel px-3 py-2 text-[13px] outline-none transition-colors focus:border-accent/60 placeholder:text-dim" />
      <button onClick={send} className="h-10 shrink-0 rounded-xl bg-gradient-to-br from-accent to-orange-600 px-4 text-[13px] font-bold text-amber-950 transition-all hover:brightness-110">发送</button>
    </div>
  );
}

  const r=S.route;
  let page;
  if(r.name==="home") page=<HomePage/>;
  else if(r.name==="ws") page=<WorkspacePage/>;
  else if(r.name==="resources") page=<ResourcesPage/>;
  else page=<EpisodeWorkbench/>;

  return (
    <div className="min-h-screen text-txt">
      <TopBar />
      {r.name==="ep" && <EpNav />}
      {page}
      <Toast />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
