# 只装 Postgres 17（ParadeDB 发行版，自带 pgvector/全文检索，资源检索出界回来时零迁移）。
# server/web 在宿主机跑：PI SDK 进程内嵌入、DashScope 走宿主机 fetch、ffmpeg 是本地二进制，不进容器。
services:
  db:
    image: crpi-o19nyprp4bui2f99.cn-hangzhou.personal.cr.aliyuncs.com/clerimia-images/paradedb:pg17
    container_name: aipodcast-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aipodcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aipodcast"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
